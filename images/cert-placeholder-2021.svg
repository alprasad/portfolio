<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F4FA" />
      <stop offset="100%" stop-color="#EBE1ED" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B2F50" />
      <stop offset="100%" stop-color="#C74634" />
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="600" height="420" rx="16" fill="url(#bgGrad)" stroke="#D8CCE0" stroke-width="2" />
  
  <!-- Outer dashed border -->
  <rect x="20" y="20" width="560" height="380" rx="12" fill="none" stroke="#4B2F50" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Top accent bar -->
  <path d="M 20 32 A 12 12 0 0 1 32 20 L 568 20 A 12 12 0 0 1 580 32 L 580 34 L 20 34 Z" fill="url(#headerGrad)" />

  <!-- Center Seal Icon -->
  <g transform="translate(300, 140)">
    <circle r="44" fill="#FFFFFF" filter="drop-shadow(0px 4px 12px rgba(75, 47, 80, 0.15))" stroke="#4B2F50" stroke-width="2" />
    <circle r="36" fill="#F4EEF5" stroke="#C74634" stroke-width="1.5" stroke-dasharray="4,2" />
    <!-- Certificate Badge Icon -->
    <path d="M-14 -10 L14 -10 L14 14 L0 24 L-14 14 Z" fill="none" stroke="#4B2F50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-8 -2 L8 -2 M-8 4 L4 4" stroke="#C74634" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Title & Instructions -->
  <text x="300" y="235" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#4B2F50" text-anchor="middle" letter-spacing="0.5">2021 CERTIFICATE</text>
  <text x="300" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#C74634" text-anchor="middle">Started at Innovacx Tech Labs</text>

  <!-- Upload box subtext -->
  <g transform="translate(300, 325)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#4B2F50" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#7A7877" text-anchor="middle">📷 Certificate Image Placeholder</text>
  </g>
</svg>
